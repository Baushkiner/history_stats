[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "histctx"
version = "0.2.0"
description = "Сбор и нормализация исторического контекста для генеалогической карты"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
# rdflib — только для разбора SPARQL в тестах: строка `@filter` в заголовке
# запроса иначе проверяется живым сервисом посреди сбора.
dev = ["pytest>=7.0", "rdflib>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
# Договорённости о виде кода записаны здесь, чтобы о них не спорили в ревью.
# Ставить ruff необязательно: он ничего не собирает и в зависимости проекта
# не входит, но `ruff check .` на репозитории проходит начисто.
line-length = 100          # столько уже держит сам код; 88 рвёт русские строки
extend-exclude = ["data"]

[tool.ruff.lint]
# Порядок импортов (`I`) намеренно не проверяется: ruff умеет раскладывать
# имена в скобках только по одному в строке, а проект пишет их столбцами по
# нескольку — длинный список иначе занимает пол-экрана.
select = ["F", "E", "W", "B", "C4", "RUF013"]
ignore = [
    # Выравнивание таблиц пробелами — намеренное: колонки выгрузки читаются
    # столбиком (`scripts/export_gulag_xlsx.py`).
    "E241",
    # `zip(..., strict=)` — решение не про стиль, а про данные: где строка
    # набора короче заголовка, обрыв бывает и ожидаемым, и признаком смены
    # формата. Ставится по месту, а не правилом на весь репозиторий.
    "B905",
    # `dict(layer="test", ...)` в тестах читается лучше фигурных скобок.
    "C408",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Пакет и скрипты видны тестам отсюда, а не из `sys.path.insert` в каждом
# файле: скрипты тесты грузят по пути (`spec_from_file_location`), и путь до
# `histctx` им нужен такой же, как самим тестам.
pythonpath = ["src", "scripts"]
